<html lang="en">
<head>

        #a2{background-color: beige;color: brown;}
    </style>
    <title>list of fruits and students</title>
</head>
<body>

 <h2 id="a2">list of students</h1>

       {% endfor %}
    </ol>

    </body>
</html>
